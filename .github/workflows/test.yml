name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npx attw --pack .
      - run: npx publint
      - run: node test/cjs-smoke.cjs
      - run: node examples/sdk-compat.mjs
      - run: |
          npm audit --audit-level=high --omit=dev || echo "audit: dev-only findings, non-blocking"
